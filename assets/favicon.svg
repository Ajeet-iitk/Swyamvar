<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="A golden fish and eye">
  <defs>
    <radialGradient id="bg" cx="50%" cy="34%" r="78%">
      <stop offset="0" stop-color="#2a1238"/>
      <stop offset="0.65" stop-color="#120a1e"/>
      <stop offset="1" stop-color="#070410"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff3cf"/>
      <stop offset="0.45" stop-color="#e9c37e"/>
      <stop offset="1" stop-color="#a97430"/>
    </linearGradient>
    <radialGradient id="eye" cx="45%" cy="40%" r="60%">
      <stop offset="0" stop-color="#fff8e2"/>
      <stop offset="0.55" stop-color="#f0c97c"/>
      <stop offset="1" stop-color="#b07a24"/>
    </radialGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="1.4"/>
    </filter>
  </defs>

  <rect width="64" height="64" rx="15" fill="url(#bg)"/>
  <circle cx="32" cy="32" r="27.5" fill="none" stroke="url(#gold)" stroke-width="1.3" opacity="0.75"/>
  <circle cx="32" cy="32" r="23" fill="none" stroke="url(#gold)" stroke-width="0.55" opacity="0.4" stroke-dasharray="1.6 4.4"/>
  <circle cx="32" cy="32" r="19.5" fill="none" stroke="url(#gold)" stroke-width="0.4" opacity="0.25"/>

  <g filter="url(#soft)" opacity="0.55">
    <ellipse cx="32" cy="33" rx="17" ry="9" fill="#e8b96b" opacity="0.35"/>
  </g>

  <!-- wheel spokes -->
  <g stroke="url(#gold)" stroke-width="0.8" opacity="0.55">
    <path d="M32 13v6M32 45v6M13 32h6M45 32h6M19 19l4 4M41 41l4 4M45 19l-4 4M23 41l-4 4"/>
  </g>

  <!-- fish -->
  <g>
    <path d="M13.5 35.5c4.2-6.4 9.1-8.7 14.3-7.6 3.6.8 5.8 3.1 8.6 4.4 2 .9 4.6.7 6.9-.4 1.6-.8 3.2-1.9 4.6-3.2-.4 2.9-1.9 5.4-4.2 7.1 2.1 1 4.1 2.4 5.9 4.2-2.5.7-4.9.5-7.2-.4-2.8-1.1-5.2-1.4-8.3-.2-5.5 2.1-10.8.4-15.4-2.6-2.1-1.4-3.7-2.6-5.2-1.3Z" fill="url(#gold)"/>
    <path d="M13.5 35.5c2.6 3.6 6.4 5.6 10.6 5.4-3.4-2.1-5.9-4.8-7.4-7.9-1.3.6-2.3 1.4-3.2 2.5Z" fill="#8a5a16" opacity="0.55"/>
    <!-- tail -->
    <path d="M44 29.5c2.6-2.4 5.6-3.6 8.2-3.9-1.3 2-2 2.9-2.1 4.4 1.3 1.6 2.6 3.6 3.4 5.8-2.9-.2-5.6-1.1-8.1-2.7Z" fill="url(#gold)"/>
    <!-- fin -->
    <path d="M29 28.4c1.9-3.5 4.6-5.3 8.2-5.6-2.1 1.9-3.2 3.5-3.6 5.4Z" fill="url(#gold)" opacity="0.9"/>
    <!-- gill + scales -->
    <path d="M36.5 29.4c1.2 2.1 1.2 4.3 0 6.6" fill="none" stroke="#7c5213" stroke-width="0.7" opacity="0.6"/>
    <g fill="none" stroke="#7c5213" stroke-width="0.45" opacity="0.5">
      <path d="M23 31.2c1 1.4 1 3.4 0 5.2M26.5 30.6c1.1 1.6 1.1 3.9 0 6M30 30.9c1 1.7 1 4 0 5.8"/>
    </g>
    <!-- eye -->
    <circle cx="49" cy="30.2" r="4.2" fill="#2a1206" opacity="0.55"/>
    <circle cx="49" cy="30.2" r="3.4" fill="url(#eye)"/>
    <circle cx="49" cy="30.2" r="1.5" fill="#1a0c05"/>
    <circle cx="50.1" cy="29.1" r="0.7" fill="#fff9e8" opacity="0.95"/>
  </g>

  <!-- oil ripple -->
  <path d="M10 47.5c8.5 2.9 27.5 3.2 44-1.4" fill="none" stroke="url(#gold)" stroke-width="0.9" opacity="0.55"/>
  <path d="M15 50.7c8.9 2.1 23.7 2 33.5-.7" fill="none" stroke="url(#gold)" stroke-width="0.5" opacity="0.3"/>
</svg>
